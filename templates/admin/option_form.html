{% extends "base.html" %}

{% block title %}

{% if option %}

Edit Option

{% else %}

Add Option

{% endif %}

{% endblock %}

{% block content %}

<section class="admin-page">

<div class="admin-container">

<div class="admin-page-header">

<h1>

{% if option %}

Edit Option

{% else %}

Create Option

{% endif %}

</h1>

<a

href="{{ url_for('admin.manage_options',question_id=question.id) }}"

class="admin-secondary-button"

>

Back

</a>

</div>

<form method="POST" class="admin-form">

<div class="admin-form-card">

<div class="form-group">

<label>

Option Key

</label>

<select name="option_key">

<option value="A"

{% if option and option.option_key=="A" %}selected{% endif %}

>A</option>

<option value="B"

{% if option and option.option_key=="B" %}selected{% endif %}

>B</option>

<option value="C"

{% if option and option.option_key=="C" %}selected{% endif %}

>C</option>

<option value="D"

{% if option and option.option_key=="D" %}selected{% endif %}

>D</option>

</select>

</div>

<div class="form-group">

<label>

Option Text

</label>

<textarea

name="option_text"

rows="4"

required

>{{ option.option_text if option else '' }}</textarea>

</div>

<div class="form-group">

<label>

Explanation

</label>

<textarea

name="explanation"

rows="3"

>{{ option.explanation if option else '' }}</textarea>

</div>

<div class="form-group">

<label>

Display Position

</label>

<input

type="number"

name="position"

value="{{ option.position if option else 1 }}"

>

</div>

<div class="form-group">

<label>

<input

type="checkbox"

name="is_correct"

{% if option and option.is_correct %}

checked

{% endif %}

>

Correct Answer

</label>

</div>

</div>

<div class="admin-form-actions">

<button

type="submit"

class="admin-primary-button"

>

{% if option %}

Update Option

{% else %}

Save Option

{% endif %}

</button>

</div>

</form>

</div>

</section>

{% endblock %}
