{% extends "base.html" %}

{% block content %}

<div class="card">

    <h2>🧠 Text Summarizer</h2>

    <form method="POST" action="{{ url_for('summarize_form') }}">

        <textarea name="text" placeholder="Paste text here..." class="custom-textarea"></textarea>

        <br>

        <button>Summarize</button>

    </form>

</div>

<style>
.custom-textarea {
    width:100%;
    height:180px;
    padding:12px;
    border-radius:10px;
    border:none;
    outline:none;
    background:#1e293b;
    color:white;
    margin-top:10px;
}
</style>

{% endblock %}
