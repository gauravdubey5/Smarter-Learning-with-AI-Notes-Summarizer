{% extends "base.html" %}
{% block content %}

<style>
.container-box {
  max-width: 800px;
  margin: auto;
}

.input-box {
  width: 100%;
  height: 150px;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,0.08);
  color: white;
  resize: none;
  font-size: 14px;
}

body.light .input-box {
  background: #f9fafb;
  color: #111;
  border: 1px solid #ddd;
}

.header {
  margin-bottom: 15px;
}

.sub-text {
  font-size: 13px;
  opacity: 0.7;
  margin-bottom: 10px;
}

.loader {
  border: 3px solid rgba(255,255,255,0.3);
  border-top: 3px solid white;
  border-radius: 50%;
  width: 16px;
  height: 16px;
  display: inline-block;
  margin-left: 8px;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

body.light .loader {
  border-top: 3px solid #111;
}

.btn {
  margin-top: 15px;
}

.word-count {
  font-size: 12px;
  margin-top: 6px;
  opacity: 0.7;
}
</style>

<div class="card container-box">

  <div class="header">
    <h2>🧠 Text Summarizer</h2>
    <div class="sub-text">Paste your text below and generate a concise summary instantly.</div>
  </div>

  <form method="POST" action="/summarize-form">

    <textarea name="text" id="textInput" placeholder="Paste your text here..." class="input-box" required></textarea>

    <div class="word-count" id="wordCount">Words: 0</div>

    <button class="btn" id="summarizeBtn">
      <span id="btnText">Summarize</span>
      <span id="loader" class="loader" style="display:none;"></span>
    </button>

  </form>

</div>

<script>

// 🔥 Loading state
document.querySelector("form").addEventListener("submit", function() {
  document.getElementById("btnText").innerText = "Processing...";
  document.getElementById("loader").style.display = "inline-block";
});

// 🔥 Word count
const textarea = document.getElementById("textInput");
const wordCount = document.getElementById("wordCount");

textarea.addEventListener("input", () => {
  const words = textarea.value.trim().split(/\s+/).filter(w => w.length > 0);
  wordCount.innerText = "Words: " + words.length;
});

</script>

{% endblock %}
