{% extends "base.html" %}

{% block content %}

<style>
.result-card {
  max-width: 800px;
  margin: auto;
  padding: 25px;
  border-radius: 15px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
}

body.light .result-card {
  background: #ffffff;
  border: 1px solid #ddd;
}

.result-text {
  margin-top: 15px;
  line-height: 1.7;
  font-size: 15px;
  white-space: pre-wrap;
}

.btn-group {
  margin-top: 20px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.btn-back {
  background: #6b7280;
}

.btn-back:hover {
  background: #4b5563;
}

.btn-copy {
  background: #10b981;
}

.btn-copy:hover {
  background: #059669;
}

.copy-msg {
  margin-top: 10px;
  font-size: 13px;
  color: #22c55e;
}
</style>

<div class="result-card">
  <h2>🧠 Summary Result</h2>

  <div class="result-text" id="summaryText">
    {{ summary }}
  </div>

  <div class="btn-group">
    <a href="{{ url_for('textsummaries') }}">
      <button class="btn btn-back">⬅️ Back</button>
    </a>

    <button class="btn btn-copy" onclick="copySummary()">📋 Copy</button>
  </div>

  <span id="copyMsg" class="copy-msg"></span>
</div>

<script>
function copySummary() {
  const text = document.getElementById("summaryText").innerText;

  navigator.clipboard.writeText(text).then(() => {
    const msg = document.getElementById("copyMsg");
    msg.innerText = "✅ Copied!";
    
    setTimeout(() => {
      msg.innerText = "";
    }, 2000);
  });
}
</script>

{% endblock %}
