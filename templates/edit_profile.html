{% extends "base.html" %}

{% block content %}

<div class="form-container">
  <form method="POST" enctype="multipart/form-data" class="form-box">

    <h2>✏️ Edit Profile</h2>

    <input type="text" name="name" value="{{ user.name }}" placeholder="Name" required>

    <select name="gender">
      <option {% if user.gender == "Male" %}selected{% endif %}>Male</option>
      <option {% if user.gender == "Female" %}selected{% endif %}>Female</option>
    </select>

    <input type="file" name="profile_pic">

    <button class="btn">Update Profile</button>

  </form>
</div>

<style>
.form-container {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 80vh;
}

.form-box {
  width: 380px;
  padding: 30px;
  border-radius: 16px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  box-shadow: 0 0 30px rgba(0,0,0,0.3);
}

.form-box h2 {
  margin-bottom: 20px;
  text-align: center;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 12px;
  border-radius: 8px;
  border: none;
  background: rgba(255,255,255,0.08);
  color: white;
}

.btn {
  width: 100%;
  margin-top: 18px;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: linear-gradient(90deg, #06b6d4, #3b82f6);
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.05);
}
</style>

{% endblock %}
