<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up | AI App</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  height: 100vh;
  background: radial-gradient(circle at top, #0f172a, #020617);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* ✨ subtle animated background glow */
body::before {
  content: "";
  position: absolute;
  width: 600px;
  height: 600px;
  background: #3b82f6;
  filter: blur(120px);
  opacity: 0.2;
  animation: float 6s ease-in-out infinite;
}

@keyframes float {
  0%,100% { transform: translateY(0px); }
  50% { transform: translateY(-30px); }
}

/* Card */
.form-box {
  width: 380px;
  padding: 35px;
  border-radius: 20px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  color: white;
  animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px);}
  to { opacity: 1; transform: translateY(0);}
}

.form-box h2 {
  text-align: center;
  margin-bottom: 20px;
}

/* Input group with icon */
.input-group {
  position: relative;
  margin-bottom: 15px;
}

.input-group input,
.input-group select {
  width: 100%;
  padding: 12px 12px 12px 40px;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,0.08);
  color: white;
}

/* Icons */
.input-group i {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-style: normal;
  opacity: 0.6;
}

.input-group input {
  height: 45px;
  padding: 0 45px 0 40px;  /* important */
}

.input-group select {
  width: 100%;
  height: 48px;
  padding: 0 40px;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,0.08);
  color: white;
  appearance: none;        /* 🔥 default arrow hatao */
  -webkit-appearance: none;
  -moz-appearance: none;
  cursor: pointer;
}

.input-group select {
  background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='20' viewBox='0 0 20 20' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M5 7l5 5 5-5z'/></svg>");
  background-repeat: no-repeat;
  background-position: right 12px center;
}

select option {
  background: #1e293b;
  color: white;
}

/* Focus glow */
.input-group input:focus,
.input-group select:focus {
  outline: none;
  box-shadow: 0 0 0 2px #3b82f6;
}

.password-group {
  position: relative;
}

.password-group input {
  width: 100%;
  height: 48px;
  padding: 0 45px 0 40px; /* space for icon */
}

.toggle-eye {
  position: absolute;
  right: 5px;
  top: 0;
  height: 100%;
  width: 40px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: none;
  background: transparent;
  cursor: pointer;
  color: #94a3b8;
  font-size: 14px;
}

.toggle-eye:hover {
  color: #3b82f6;
}

/* Button */
.btn {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.04);
}

/* Footer */
.footer {
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
}

.footer a {
  color: #3b82f6;
  text-decoration: none;
}
</style>

</head>

<body>

<div class="form-box">
  <h2>Create Account 🚀</h2>

  <form method="POST">

  <div class="input-group">
    <i>👤</i>
    <input type="text" name="name" placeholder="Full Name" required>
  </div>

  <div class="input-group">
    <i>📧</i>
    <input type="email" name="email" placeholder="Email Address" required>
  </div>

  <div class="input-group password-group">
    <i>🔒</i>
    <input type="password" id="password" name="password" placeholder="Password" required>

    <button type="button" class="toggle-eye" onclick="togglePassword()">
      <i class="fa-solid fa-eye"></i>
    </button>
  </div>

    <div class="input-group">
      <i>🔒</i>
      <input type="password" id="confirm_password" placeholder="Confirm Password" required>
    </div>

  <!-- ✅ FIXED GENDER (IMPORTANT) -->
  <div class="input-group">
    <i>⚧️</i>
    <select name="gender" required>
      <option value="">Select Gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>
  </div>

  <div class="input-group">
    <i>❓</i>
    <select name="question" required>
      <option value="">Select Security Question</option>
      <option value="Your pet name?">Your pet name?</option>
      <option value="Your first school?">Your first school?</option>
      <option value="Your favorite food?">Your favorite food?</option>
    </select>
  </div>

  <div class="input-group">
    <i>✍️</i>
    <input type="text" name="answer" placeholder="Your Answer" required>
  </div>

  <button class="btn">Sign Up</button>

</form>
  <div class="footer">
    Already have an account? <a href="/login">Login</a>
  </div>
</div>

<!-- 🔥 Loading Animation -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  const form = document.querySelector("form");
  const btn = document.querySelector(".btn");

  form.addEventListener("submit", function () {
    btn.innerText = "Creating Account...";
    btn.disabled = true;
    btn.style.opacity = "0.7";
  });
});
// show/hide password
function togglePassword() {
  const p = document.getElementById("password");
  const icon = document.querySelector(".toggle-eye i");

  if (p.type === "password") {
    p.type = "text";
    icon.classList.replace("fa-eye", "fa-eye-slash");
  } else {
    p.type = "password";
    icon.classList.replace("fa-eye-slash", "fa-eye");
  }
}
</script>

</body>
</html>
