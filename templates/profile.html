{% extends "base.html" %}

{% block content %}

<div class="card">
    <h2>{{ user['name'] }}</h2>

    {% if user['profile_pic'] %}
        <img src="{{ url_for('static', filename='uploads/' + user['profile_pic']) }}" 
            style="border-radius:50%; width:120px; margin-bottom:15px;">    {% else %}
        <img src="/static/default.png">
    {% endif %}

    <p>Email: {{ user['email'] }}</p>
    <p>Gender: {{ user['gender'] }}</p>

    <br>

    <a href="/edit-profile"><button>Edit</button></a>
    <a href="/change-password"><button>Change Password</button></a>
    <a href="/logout"><button>Logout</button></a>
</div>

{% endblock %}
