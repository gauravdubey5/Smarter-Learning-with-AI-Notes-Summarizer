{% extends "base.html" %}
{% block content %}

<style>
.team-container {
  max-width: 1100px;
  margin: auto;
  text-align: center;
}

.team-title {
  font-size: 28px;
  margin-bottom: 10px;
}

.team-subtitle {
  opacity: 0.7;
  margin-bottom: 30px;
}

.team-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
}

/* CARD */
.team-card {
  padding: 25px;
  border-radius: 18px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  transition: 0.3s;
  position: relative;
  overflow: hidden;
}

.team-card:hover {
  transform: translateY(-8px) scale(1.03);
  box-shadow: 0 15px 40px rgba(0,0,0,0.4);
}

/* Glow effect */
.team-card::before {
  content: "";
  position: absolute;
  width: 150px;
  height: 150px;
  background: #3b82f6;
  filter: blur(80px);
  opacity: 0.2;
  top: -50px;
  left: -50px;
}

/* Name */
.team-card h3 {
  margin-top: 10px;
}

/* Role */
.role {
  font-size: 14px;
  margin-top: 5px;
  color: #3b82f6;
  font-weight: 600;
}

/* Avatar */
.avatar {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  margin: auto;
  margin-bottom: 10px;
}

/* Back button */
.back-btn {
  margin-top: 30px;
}
</style>
<form action="/team" method="get"></form>
<div class="team-container">

  <h2 class="team-title">🚀 Meet Our Team</h2>
  <p class="team-subtitle">AI Notes Summarizer Development Team</p>

  <div class="team-grid">

    <div class="team-card">
      <div class="avatar">G</div>
      <h3>Gaurav</h3>
      <p class="role">Leader & Backend</p>
    </div>

    <div class="team-card">
      <div class="avatar">U</div>
      <h3>Ujjwal</h3>
      <p class="role">Co-Leader & Backend</p>
    </div>

    <div class="team-card">
      <div class="avatar">H</div>
      <h3>Himanshu</h3>
      <p class="role">Frontend</p>
    </div>

    <div class="team-card">
      <div class="avatar">V</div>
      <h3>Vishal</h3>
      <p class="role">Frontend</p>
    </div>

    <div class="team-card">
      <div class="avatar">S</div>
      <h3>Shivanand</h3>
      <p class="role">NLP & Database</p>
    </div>

  </div>

  <div class="back-btn">
    <a href="/dashboard">
      <button class="btn">⬅ Back to Dashboard</button>
    </a>
  </div>

</div>

{% endblock %}
